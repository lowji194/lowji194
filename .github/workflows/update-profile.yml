name: Refresh Profile README

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - README-EN.md
      - README-VI.md
      - scripts/update_profile.py
      - .github/workflows/update-profile.yml
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Featured repository selection mode
        required: true
        default: random
        type: choice
        options:
          - random
          - stars
          - views

permissions:
  contents: write

concurrency:
  group: profile-readme-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh profile statistics and featured repositories
        env:
          PROFILE_OWNER: lowji194
          PROFILE_MODE: \${{ inputs.mode || 'random' }}
          PROFILE_TRAFFIC_TOKEN: \${{ secrets.PROFILE_TRAFFIC_TOKEN }}
        run: python scripts/update_profile.py

      - name: Commit updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README-EN.md README-VI.md
          if git diff --cached --quiet; then
            echo "No README changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile statistics and featured repositories"
          git push
